name: LivePocket 受付情報の事前収集（一時的）

# 初回は約 9,000 件のイベントの受付情報がそろっていないため、本番（5:07 JST）の前に何度か収集だけ行う。
# Discord には送らない。2026/10/30 4:40 JST を過ぎたら何もしない（後で削除する）。
on:
  schedule:
    - cron: "17 16 29 10 *" # 10/30 1:17 JST
    - cron: "17 17 29 10 *" # 10/30 2:17 JST
    - cron: "17 18 29 10 *" # 10/30 3:17 JST
    - cron: "7 19 29 10 *"  # 10/30 4:07 JST
  workflow_dispatch:

jobs:
  # 期限の確認は別ジョブにする。期限切れのときに下のジョブが順番待ちに入り、
  # 本番の通知を取り消してしまわないようにするため
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "$(TZ=Asia/Tokyo date +%Y%m%d%H%M)" -le 202610300440 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "期限を過ぎたので何もしません"
          fi

  seed:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 本番の通知と同じグループにして、保存データを同時に書き換えないようにする
    concurrency:
      group: state-livepocket
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 前回の受付情報キャッシュを復元
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-livepocket-${{ github.run_id }}
          restore-keys: state-livepocket-
      - name: 収集（Discord には送らない）
        env:
          # 通常の 2 倍。2 回動けば約 9,000 件の受付情報がそろう
          LIVEPOCKET_MAX_DETAILS: "5000"
        run: python main.py collect livepocket /tmp/seed.json
      - name: 受付情報キャッシュを保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-livepocket-${{ github.run_id }}
