name: 本日発売チケット通知

on:
  # 毎朝 6:30 JST に外部サービス（cron-job.org）から workflow_dispatch で起動する。
  # GitHub のスケジュール実行はこの時間帯に 4 時間近く遅れることが続いたため使わない。
  # 収集（30〜60分）のあと 8:00 JST まで待って送信する
  workflow_dispatch:

jobs:
  # サイトごとに並行して集める
  collect:
    strategy:
      fail-fast: false
      matrix:
        source: [ticketdive, livepocket]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # 同じサイトの実行が重なって保存データを同時に書き換えないよう、順番に動かす
    concurrency:
      group: state-${{ matrix.source }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 前回の受付情報キャッシュを復元
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ matrix.source }}-${{ github.run_id }}
          restore-keys: state-${{ matrix.source }}-
      - name: 収集
        run: python main.py collect ${{ matrix.source }} result-${{ matrix.source }}.json
      - name: 受付情報キャッシュを保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ matrix.source }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.source }}
          path: result-${{ matrix.source }}.json
          retention-days: 7

  # 集めた結果を 1 つの投稿にまとめ、8:00 JST に送る（どちらかのサイトが失敗しても送る）
  send:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: results
        continue-on-error: true
      - name: 送信
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py send results/*.json
