name: 本日発売チケット通知

on:
  schedule:
    # 2:43 JST (= 前日 17:43 UTC) に起動して収集し（30〜60分）、8:00 JST まで待って送信する。
    # GitHub のスケジュール実行は数時間遅れることがあるため大きく前倒ししている。
    # 待ち時間を含めてもジョブの上限 6 時間に収まるよう、起動はこれより早めない
    - cron: "43 17 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 前回の受付情報キャッシュを復元
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: 通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
      - name: 受付情報キャッシュを保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}
