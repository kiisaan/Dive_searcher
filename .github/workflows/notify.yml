name: 本日発売チケット通知

on:
  schedule:
    # 5:07 JST (= 前日 20:07 UTC) に起動して収集し（30〜60分）、8:00 JST まで待って送信する。
    # GitHub のスケジュール実行は遅れることがあるため前倒ししている。
    # 毎時 0 分は混雑して遅れやすいので少しずらしている
    - cron: "7 20 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 前回の受付情報キャッシュを復元
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: 通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
      - name: 受付情報キャッシュを保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}
