        }

        }

            color: #444;
            margin-top: unset;
            margin-bottom: 10px;
            line-height: 1.7;
        }
        .error-footer-terms > p:last-child {
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: #555;
            padding-top: 20px;
        }

            display: none;
        }
        @media screen and (max-width: 640px) {

            }
            #message {
                font-size: 12px;
                padding: 26px;
            }
            .error-footer {
                min-width: unset;
                padding: 20px 0;

            }
            .error-footer-terms > p {
                font-size: 10px;
                margin-top: unset;
            }
            .error-footer-terms > p:last-child {
                padding-top: unset;
                font-size: 12px;
                color: #444;
            }
            .error-footer-terms > p > br {
